name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'            # Запуск при создании тега версий (например, v1.0.0, v1.0.1)
  workflow_dispatch:   # Ручной запуск с выбором названия версии из браузера
    inputs:
      tag_name:
        description: 'Номер версии (например: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write      # Необходимо для создания релиза и загрузки APK

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        run: |
          # Поиск собранного APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # Генерация ключа подписи на лету
          keytool -genkey -v -keystore release.keystore -alias release_alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=XDWallpaper, OU=Mobile, O=XD, L=City, S=State, C=US"

          # Подпись через apksigner из Android SDK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias release_alias \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out XDWallpaper.apk "$UNSIGNED_APK"

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "XD Wallpaper Engine ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: XDWallpaper.apk
          
